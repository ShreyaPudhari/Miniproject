
<!DOCTYPE html>
<html>
<head>
    <title>Admin - Breakdown Requests</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>Customer Breakdown Requests</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Vehicle Type</th>
            <th>Problem Description</th>
            <th>Location</th>
        </tr>

        {% for item in requests %}
        <tr>
            <td>{{ item[0] }}</td>
            <td>{{ item[1] }}</td>
            <td>{{ item[2] }}</td>
            <td>{{ item[3] }}</td>
            <td>{{ item[4] }}</td>
            <td>{{ item[5] }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/admin_dashboard">Back to Dashboard</a>

</body>
</html>
