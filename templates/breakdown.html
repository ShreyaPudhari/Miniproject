
<!DOCTYPE html>
<html>
<head>
    <title>Breakdown Assistance</title>
</head>
<body>
    <h1>Breakdown Assistance Request</h1>

    <form action="/submit_breakdown" method="POST">

        <label>Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Mobile:</label>
        <input type="tel" name="mobile" required>
        <br><br>

        <label>Vehicle Type:</label>
        <input type="text" name="vehicle" required>
        <br><br>

        <label>Problem Description:</label>
        <textarea name="problem" required></textarea>
        <br><br>

        <label>Current Location:</label>
        <input type="text" name="location" required>
        <br><br>

        <button type="submit">Submit Request</button>
    </form>

    <a href="/customer_home">Back</a>
</body>
</html>
